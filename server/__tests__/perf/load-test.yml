config:
  target: 'http://localhost:4000'
  phases:
    - duration: 20
      arrivalRate: 2
      name: "Warm up"
    - duration: 60
      arrivalRate: 5
      name: "Sustained load"
  # This section helps catch errors before they mess up the report
  defaults:
    headers:
      Content-Type: "application/json"

scenarios:
  - name: "1. Guest: Browsing"
    weight: 50
    flow:
      - get:
          url: "/api/v1/products"
      - get:
          url: "/api/v1/categories"

  - name: "2. New User: Registration Flow"
    weight: 20
    flow:
      - post:
          url: "/api/v1/auth/register"
          json:
            name: "Performance Tester"
            email: "tester_{{ $randomString }}@example.com"
            password: "password123"
            confirmPassword: "password123"
            role: "user"
          capture:
            - json: "$.token"
              as: "captured_token"
      - log: "Successfully registered and captured token for {{ $randomString }}"

  - name: "3. Buyer: Order Attempt"
    weight: 15
    flow:
      - post:
          url: "/api/v1/auth/login"
          json:
            email: "artisan@test.com"
            password: "password123"
          capture:
            - json: "$.token"
              as: "buyer_token"
      - post:
          url: "/api/v1/orders"
          headers:
            Authorization: "Bearer {{ buyer_token }}"
          json:
            orderItems:
              - product: "REPLACE_WITH_REAL_PRODUCT_ID"
                quantity: 1
            shippingAddress:
              country: "Sri Lanka"
            paymentMethod: "Stripe"

  - name: "4. Communication: Chat Message"
    weight: 15
    flow:
      - post:
          url: "/api/v1/auth/login"
          json:
            email: "artisan@test.com"
            password: "password123"
          capture:
            - json: "$.token"
              as: "chat_token"
      - post:
          url: "/api/v1/chat/message"
          headers:
            Authorization: "Bearer {{ chat_token }}"
          json:
            chatId: "REPLACE_WITH_REAL_CHAT_ID"
            content: "Hello from performance test! {{ $randomString }}"
